[project]
name = "weight-vq-qtip-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==2.20.0",
    "glog==0.3.1",
    "huggingface-hub>=0.30,<1",
    "numpy==2.1.2",
    "paroquant",
    "pillow==12.3.0",
    "qtip",
    "safetensors>=0.4.3,<1",
    "scipy==1.14.1",
    "setuptools==69.5.1",
    "tqdm==4.66.4",
    "transformers==4.57.6",
    "weight-vq",
]

[project.optional-dependencies]
cu124 = [
    "accelerate==0.34.2",
    "fast-hadamard-transform==1.0.4.post1",
    "torch==2.6.0",
]
cu128 = [
    "accelerate==0.34.2",
    "fast-hadamard-transform==1.0.4.post1",
    "torch==2.9.0",
]

[tool.uv]
package = false
preview-features = ["extra-build-dependencies"]
conflicts = [[{ extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
fast-hadamard-transform = { git = "https://github.com/Dao-AILab/fast-hadamard-transform.git", rev = "4ea722e434e3d4f2a14522341959ebdbe62be2de" }
paroquant = { path = "../../third_party/paroquant", editable = true }
qtip = { path = "../../third_party/qtip", editable = true }
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]
weight-vq = { path = "../..", editable = true }

[[tool.uv.dependency-metadata]]
name = "fast-hadamard-transform"
version = "1.0.4.post1"
requires-python = ">=3.7"
requires-dist = ["torch", "packaging", "ninja"]

[tool.uv.extra-build-dependencies]
fast-hadamard-transform = [
    { requirement = "torch", match-runtime = true },
    "setuptools==69.5.1",
    "wheel==0.48.0",
    "packaging==26.3",
    "ninja==1.13.0",
]

[tool.uv.extra-build-variables]
fast-hadamard-transform = { FAST_HADAMARD_TRANSFORM_FORCE_BUILD = "TRUE" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
