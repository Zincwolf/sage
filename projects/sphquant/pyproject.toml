[project]
name = "weight-vq-sphquant-environment"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==2.20.0",
    "huggingface-hub>=0.30,<1",
    "numpy==2.1.2",
    "paroquant",
    "pillow==12.3.0",
    "safetensors>=0.4.3,<1",
    "scipy==1.14.1",
    "simple-parsing==0.1.9",
    "tqdm==4.66.4",
    "transformers==4.57.6",
    "wandb==0.28.2",
    "weight-vq",
]

[project.optional-dependencies]
cu124 = [
    "accelerate==0.34.2",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
cu128 = [
    "accelerate==0.34.2",
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[tool.uv]
package = false
conflicts = [[{ extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
paroquant = { path = "../../third_party/paroquant", editable = true }
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]
weight-vq = { path = "../..", editable = true }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true
