[project]
name = "weight-vq"
dynamic = ["version"]
description = "Reproducible weight vector quantization pipelines"
requires-python = ">=3.11,<3.12"
dependencies = [
    "datasets==2.20.0",
    "glog==0.3.1",
    "huggingface-hub>=0.30,<1",
    "jsonargparse[signatures]==4.50.0",
    "numpy==2.1.2",
    "paroquant",
    "pillow==12.3.0",
    "qtip",
    "safetensors>=0.4.3,<1",
    "scipy==1.14.1",
    "setuptools==69.5.1",
    "simple-parsing==0.1.9",
    "tqdm==4.66.4",
    "transformers==4.57.6",
    "wandb==0.28.2",
]

[project.optional-dependencies]
cu124 = [
    "accelerate==0.34.2",
    "fast-hadamard-transform==1.0.4.post1",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
cu128 = [
    "accelerate==0.34.2",
    "fast-hadamard-transform==1.0.4.post1",
    "torch==2.9.0",
    "torchvision==0.24.0",
]

[project.scripts]
wvq = "weight_vq.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.37,<2",
    "pytest>=8.3,<9",
    "ruff>=0.15,<0.16",
]

[tool.hatch.version]
path = "weight_vq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["weight_vq"]

[tool.uv]
preview-features = ["extra-build-dependencies"]
conflicts = [[{ extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
fast-hadamard-transform = { path = "third_party/fast-hadamard-transform" }
paroquant = { path = "third_party/paroquant", editable = true }
qtip = { path = "third_party/qtip", editable = true }
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.dependency-metadata]]
name = "fast-hadamard-transform"
version = "1.0.4.post1"
requires-python = ">=3.7"
requires-dist = ["torch", "packaging", "ninja"]

[tool.uv.extra-build-dependencies]
fast-hadamard-transform = [
    { requirement = "torch", match-runtime = true },
    "setuptools==69.5.1",
    "wheel==0.48.0",
    "packaging==26.3",
    "ninja==1.13.0",
]

[tool.uv.extra-build-variables]
fast-hadamard-transform = { FAST_HADAMARD_TRANSFORM_FORCE_BUILD = "TRUE" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["weight_vq", "tests"]
exclude = ["third_party"]
extraPaths = ["third_party/qtip", "third_party/paroquant"]
