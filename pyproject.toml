[project]
name = "weight-vq"
dynamic = ["version"]
description = "Reproducible weight vector quantization pipelines"
requires-python = ">=3.11,<3.12"
dependencies = ["jsonargparse[signatures]==4.50.0"]

[project.scripts]
wvq = "weight_vq.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "basedpyright>=1.37,<2",
    "pytest>=8.3,<9",
    "ruff>=0.15,<0.16",
]

[tool.hatch.version]
path = "weight_vq/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["weight_vq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["weight_vq", "tests"]
exclude = ["third_party"]
