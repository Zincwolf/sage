[project]
name = "weight-vq"
version = "0.1.0"
description = "Reproducible weight vector quantization pipelines"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
dependencies = [
    "glog==0.3.1",
    "httpx>=0.28,<1",
    "pandas>=2,<4",
    "pyarrow>=15",
    "jsonargparse[signatures]==4.50.0",
    "paroquant",
    "pillow==12.3.0",
    "primefac==2.0.12",
    "qtip",
    "quip-sharp",
    "rich==15.0.0",
    "unisvq",
    "safetensors>=0.4.3,<1",
    "scipy==1.14.1",
    "setuptools==69.5.1",
    "simple-parsing==0.1.9",
    "tqdm==4.66.4",
    "wandb==0.28.2",
]

[project.optional-dependencies]
# Deprecated and unmaintained: cu124 is retained for legacy environments.
# Use cu128 for current model support and development.
cu124 = [
    "quiptools-cuda",
    "datasets==2.20.0",
    "huggingface-hub>=0.30,<1",
    "numpy==2.1.2",
    "transformers==4.57.6",
    "accelerate==0.34.2",
    "fast-hadamard-transform==1.0.4.post1",
    "torch==2.6.0",
    "torchvision==0.21.0",
]
cu128 = [
    "quiptools-cuda",
    "gptqmodel==7.3.6",
    "datasets>=3.6.0",
    "huggingface-hub>=1,<2",
    "numpy==2.2.6",
    "transformers==5.15.0",
    "accelerate>=1.13.0",
    "fast-hadamard-transform==1.0.4.post1",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "torchao==0.16.0",
]

[project.scripts]
wvq = "weight_vq.cli:main"

[build-system]
requires = ["scikit-build-core==0.11.6", "ninja==1.13.0"]
build-backend = "scikit_build_core.build"

[dependency-groups]
dev = [
    "basedpyright>=1.37,<2",
    "pytest>=8.3,<9",
    "ruff>=0.15,<0.16",
]

[tool.scikit-build]
cmake.version = ">=3.28"
cmake.build-type = "Release"
wheel.packages = ["weight_vq", "benchmarks"]
build-dir = "build/{wheel_tag}"
# Include the patched sources when building an sdist without Git submodules.
sdist.include = [
    "third_party/qtip/LICENSE",
    "third_party/qtip/qtip-kernels/src/*.cpp",
    "third_party/qtip/qtip-kernels/src/*.cu",
    "third_party/qtip/qtip-kernels/src/*.h",
    "third_party/unisvq/hadaquant/csrc/*.cpp",
    "third_party/unisvq/hadaquant/csrc/*.cu",
]

[tool.uv]
preview-features = ["extra-build-dependencies"]
conflicts = [[{ extra = "cu124" }, { extra = "cu128" }]]

[tool.uv.sources]
fast-hadamard-transform = { path = "third_party/fast-hadamard-transform" }
paroquant = { path = "third_party/paroquant", editable = true }
qtip = { path = "third_party/qtip", editable = true }
quip-sharp = { path = "third_party/quip-sharp", editable = true }
unisvq = { path = "third_party/unisvq", editable = true }
quiptools-cuda = { path = "third_party/quip-sharp/quiptools" }
torch = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]
torchvision = [
    { index = "pytorch-cu124", extra = "cu124" },
    { index = "pytorch-cu128", extra = "cu128" },
]

[[tool.uv.dependency-metadata]]
name = "fast-hadamard-transform"
version = "1.0.4.post1"
requires-python = ">=3.7"
requires-dist = ["torch", "packaging", "ninja"]

[tool.uv.extra-build-dependencies]
weight-vq = [{ requirement = "torch", match-runtime = true }]
quiptools-cuda = [
    { requirement = "torch", match-runtime = true },
    "setuptools==69.5.1",
    "wheel==0.48.0",
    "packaging==26.3",
    "ninja==1.13.0",
]
fast-hadamard-transform = [
    { requirement = "torch", match-runtime = true },
    "setuptools==69.5.1",
    "wheel==0.48.0",
    "packaging==26.3",
    "ninja==1.13.0",
]

[tool.uv.extra-build-variables]
fast-hadamard-transform = { FAST_HADAMARD_TRANSFORM_FORCE_BUILD = "TRUE" }

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
markers = ["cuda: requires weight-vq's compiled CUDA inference extensions"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.format]
skip-magic-trailing-comma = true
quote-style = "double"

[tool.basedpyright]
typeCheckingMode = "standard"
pythonVersion = "3.11"
include = ["weight_vq", "benchmarks", "tests"]
exclude = ["third_party"]
extraPaths = ["third_party/qtip", "third_party/paroquant", "third_party/quip-sharp", "third_party/unisvq"]
