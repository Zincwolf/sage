# QuIP# paper W2 E8P, block reconstruction only; no E2E tuning.
model: /path/to/Qwen3-4B-Instruct-2507
dataset: /path/to/RedPajama/Arrows
output_dir: /path/to/outputs/quip-sharp/qwen3-4b-rp-blockwise
devices: [0, 1]
model_dtype: bfloat16
seed: 0

# Paper sample count; 2048 context is the agreed modern-model migration choice.
hessian_samples: 6144
hessian_sequence_length: 2048
train_samples: 256
validation_samples: 128
sequence_length: 2048

# Memory/throughput controls; they do not change global batch size.
hessian_chunk_size: 256
forward_microbatch_size: 1
reconstruction_microbatch_size: 1
replay_device: cuda
num_cpu_threads: 8

sigma_reg: 0.01
scale_override: 0.9
quip_tune_iters: 10
# Quantizer arithmetic only. Hessian statistics always use FP64 for QuIP#.
use_fp64: false
reconstruction_epochs: 5
learning_rate: 0.00005
susv_learning_rate: 0.0005
batch_size: 8
gradient_checkpointing: false
