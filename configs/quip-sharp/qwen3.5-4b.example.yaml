# QuIP# W2 E8P; Qwen3.5 VL wrapper with text-only language calibration.
model: /mnt/hdd/share_folder/Qwen3.5-4B
dataset: /path/to/RedPajama/Arrows
output_dir: /path/to/outputs/quip-sharp/qwen3.5-4b
devices: [0, 1, 2, 3]
model_dtype: bfloat16
seed: 0

hessian_samples: 6144
hessian_sequence_length: 2048
train_samples: 256
validation_samples: 128
sequence_length: 2048

# Execution settings are independent of the method's logical training batch.
hessian_chunk_size: 32
forward_microbatch_size: 1
reconstruction_microbatch_size: 1
replay_device: cpu
num_cpu_threads: 8

sigma_reg: 0.01
scale_override: 0.9
quip_tune_iters: 10
use_fp64: false
reconstruction_epochs: 5
learning_rate: 0.00005
susv_learning_rate: 0.0005
batch_size: 8
gradient_checkpointing: true
