# QuIP# W2 E8P MoE migration; formal 30B quantization is run by the researcher.
model: /path/to/Qwen3-30B-A3B-Instruct-2507
dataset: /path/to/RedPajama/Arrows
output_dir: /path/to/outputs/quip-sharp/qwen3-30b-a3b-rp-blockwise
devices: [0, 1, 2, 3]
model_dtype: bfloat16
seed: 0
num_cpu_threads: 8

hessian_samples: 6144
hessian_sequence_length: 2048
train_samples: 256
validation_samples: 128
sequence_length: 2048

# Global sequence count per chunk; smaller chunks reduce activation memory
# but increase reads/writes of the per-layer statistics on the output filesystem.
hessian_chunk_size: 64
forward_microbatch_size: 1
reconstruction_microbatch_size: 1
replay_device: cpu

# Expert input tokens / original calibration tokens, without a top-k multiplier.
# 0.0: only zero coverage falls back; 0.005 would mean a 0.5% threshold.
# Fallback retains E8P encoding, using an identity metric.
min_expert_coverage: 0.0

sigma_reg: 0.01
scale_override: 0.9
quip_tune_iters: 10
use_fp64: false
# Attention: per projection. Experts: after each whole gate/up/down group.
reconstruction_epochs: 5
learning_rate: 0.00005
susv_learning_rate: 0.0005
batch_size: 8
gradient_checkpointing: true
