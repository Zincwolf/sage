# Persistent directory for the frozen ShareGPT4V annotation, selected COCO
# images, and coco_calibration_manifest.json.
output_dir: /path/to/sharegpt4v-coco

# Parallel image downloads. Existing valid images are reused on reruns.
workers: 32

# Optional local official train2017.zip. null downloads only the selected 2,048
# images from COCO instead of extracting the complete archive.
image_archive: null

# Permit replacing the final manifest; downloaded valid images are still reused.
force: false
