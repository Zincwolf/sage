# Complete HF Ministral-3 wrapper; calibration is text-only.
model: /path/to/Ministral-3-8B-Instruct-2512-BF16
calibration: outputs/calibration/calibration.pt
output_dir: outputs/sphquant/ministral3
device: 0

# Paper baseline: 64 directions / 4 radius bits, FP16 radius-grid QDQ.
codebook_bits: 6
sample_size: 65536
kmeans_iterations: 20

# Quantized student inputs, dense teacher targets; FP16 reconstruction.
epochs: 20
learning_rate: 0.001
batch_size: 16
gradient_accumulation_steps: 1
cache_shards: 8
resume: true
checkpointing: true
seed: 0
max_layers: null
calibration_limit: null
use_wandb: false
