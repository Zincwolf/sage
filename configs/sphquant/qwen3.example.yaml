# Original dense Qwen3 Hugging Face model and tokenized calibration artifact.
model: /path/to/Qwen3-4B-Instruct-2507
calibration: outputs/calibration/calibration.pt

# Derives checkpoints/<model.name> and exported_model under this directory.
output_dir: outputs/sphquant/qwen3
# Optional packed HF export uses the 64/4 CUDA kernel; false keeps dense QDQ.
export_compressed: false

# SPHQuant is sequential across layers and therefore uses one physical GPU.
device: 0

# Published SPHQuant split: 64 directions, 4-bit radii, FP16 grid offset/step.
# codebook_bits: 8 instead uses 256 directions and 2-bit radii at the same payload.
sample_size: 65536
kmeans_iterations: 20
codebook_bits: 6

# Layerwise radius/codebook recovery. The verified full recipe uses 20 epochs.
epochs: 20
learning_rate: 0.001
batch_size: 16
gradient_accumulation_steps: 1
cache_shards: 8
resume: true
checkpointing: true

# Reproducibility and smoke controls; null means all decoder layers/samples.
seed: 0
max_layers: null
calibration_limit: null
use_wandb: false
