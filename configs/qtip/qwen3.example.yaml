# Original Qwen3 Hugging Face model and pre-tokenized mixed-text calibration.
model: /path/to/Qwen3-4B-Instruct-2507
calibration: /path/to/calibration.pt
# Artifact subdirectories are derived from this experiment directory.
output_dir: outputs/qtip/qwen3

# Every selected GPU processes a rank-local slice of each global batch.
devices: [0, 1, 2, 3]
seed: 0
layer_start: 0
layer_end: null
num_cpu_threads: 8
model_dtype: bfloat16

# Verified Qwen3 token calibration protocol: 1920 train and 128 validation
# sequences of 2048 tokens. The configured global replay batch size is 16.
train_samples: 1920
validation_samples: 128
batch_size: 16
replay_device: cuda
include_padding_in_hessian: false

# Verified W2 bitshift trellis recipe.
td_x: 16
td_y: 16
L: 16
K: 2
V: 2
tlut_bits: 9
decode_mode: quantlut_sym
sigma_reg: 0.01
scale_override: 0.9
use_fp64: false

# The verified Qwen3 PTQ baseline does not run layer reconstruction.
reconstruction_epochs: 5
learning_rate: 0.000003
update_frequency: 1
validation_frequency: 1
early_stop: 1
gradient_checkpointing: false
train_lut: false
mask_padding: true

# Dense QDQ does not use packed inference or tensor-parallel checkpoints.
packed_inference_kernel: false
split_for_tp: false
tp_rank: 8
