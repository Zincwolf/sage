# Original Qwen3-VL Hugging Face model and frozen COCO multimodal manifest.
model: /path/to/Qwen3-VL-8B-Instruct
calibration: /path/to/coco-calibration.manifest.json
hessians: outputs/qtip/hessians
checkpoints: outputs/qtip/checkpoints
exported_model: outputs/qtip/hf-dense-qdq

# Execution. Every selected GPU processes a rank-local slice of each global batch.
devices: [0, 1, 2, 3]
seed: 0
layer_start: 0
layer_end: null
num_cpu_threads: 8
model_dtype: bfloat16

# Calibration. This is the verified Qwen3-VL baseline; changing these values
# has unknown quantization-quality and checkpoint-compatibility consequences.
train_samples: 512
validation_samples: 128
batch_size: 16
replay_device: cuda
include_padding_in_hessian: false

# Bitshift trellis. This is the verified W2 baseline; changing these values has
# unknown numerical-stability, quality, and checkpoint-compatibility consequences.
td_x: 16
td_y: 16
L: 16
K: 2
V: 2
tlut_bits: 9
decode_mode: quantlut_sym
sigma_reg: 0.01
scale_override: 0.9
use_fp64: false

# Layer reconstruction. This is the verified baseline; changing these values
# has unknown numerical-stability, quality, and checkpoint-compatibility consequences.
reconstruction_epochs: 5
learning_rate: 0.000003
update_frequency: 1
validation_frequency: 1
early_stop: 1
gradient_checkpointing: false
train_lut: false
mask_padding: true

# Dense QDQ uses both values below as false. Packed or TP checkpoints cannot be
# represented by this pipeline's dense export.
packed_inference_kernel: false
split_for_tp: false
tp_rank: 8
