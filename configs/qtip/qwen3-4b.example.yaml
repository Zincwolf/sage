# Qwen3 blockwise W2 migration: no E2E, plain-text RedPajama train documents.
model: /path/to/Qwen3-4B-Instruct-2507
dataset: /path/to/RedPajama/Arrows
output_dir: /path/to/outputs/qtip/qwen3-4b-rp-blockwise

devices: [0, 1, 2, 3]
seed: 0
layer_start: 0
layer_end: null
num_cpu_threads: 8
model_dtype: bfloat16

# QTIP Llama-3 Hessian specification migrated to Qwen3, not validated by the paper.
hessian_samples: 4096
hessian_sequence_length: 8192
# Independent long-document prefixes; train first, validation second.
train_samples: 256
validation_samples: 128
sequence_length: 2048

# Execution controls: global Hessian chunk, then per-rank forward microbatch.
hessian_chunk_size: 256
forward_microbatch_size: 1
reconstruction_microbatch_size: 1
# Reconstruction placement only. Hessian keeps just the current chunk on CUDA.
replay_device: cuda

td_x: 16
td_y: 16
L: 16
K: 2
V: 2
tlut_bits: 9
decode_mode: quantlut_sym
sigma_reg: 0.01
scale_override: 0.9
use_fp64: false

# Adam, complete block MSE after every newly quantized projection.
reconstruction_epochs: 5
learning_rate: 0.00005
susv_learning_rate: 0.0005
batch_size: 8
# LUT belongs to the ordinary group as a migration choice, not a QuIP# prescription.
train_lut: true
gradient_checkpointing: false
