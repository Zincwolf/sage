# Native HF Qwen3 MoE; text calibration, router frozen and excluded.
model: /path/to/Qwen3-30B-A3B
calibration: outputs/calibration/calibration.pt
output_dir: outputs/sage/qwen3-moe
device: 0

esg: true
adaptive_bits: true
energy_power: 0.75
# ABS requires every matrix to see tokens. Opt in to skip unmeasured entries;
# these use codebook_bits below, not the best split of another matrix.
allow_partial: false
codebook_bits: 6
sample_size: 65536
kmeans_iterations: 20

# Sequential single-GPU ParoQuant reconstruction, not blockwise dense-input FT.
epochs: 20
learning_rate: 0.001
batch_size: 16
gradient_accumulation_steps: 1
cache_shards: 8
resume: true
checkpointing: true
seed: 0
max_layers: null
calibration_limit: null
use_wandb: false
